# =============================================================================
# Règles de sécurité Nginx — Ashtech Pay — à coller dans Plesk
# =============================================================================
#
# POURQUOI CE FICHIER EXISTE :
# Le fichier .htaccess (dans dist/public/.htaccess) ne fonctionne QUE si Apache
# traite la requête. Sur Plesk, quand l'option "Servir les fichiers statiques
# directement par nginx" (ou "Smart static files processing") est activée pour
# ce domaine, c'est NGINX qui répond directement aux requêtes de fichiers
# statiques — il ne lit JAMAIS le .htaccess (qui est une fonctionnalité
# propre à Apache). C'est très probablement pour ça que /.env, /.git/HEAD,
# /shell.php, /wp-config.php, etc. continuent de répondre 200 malgré les
# corrections déjà appliquées dans .htaccess.
#
# COMMENT L'APPLIQUER :
# 1. Connectez-vous à votre panneau Plesk.
# 2. Allez dans : Domaines → ashtechpay.top → Paramètres Apache & nginx.
# 3. Descendez jusqu'à "Directives nginx supplémentaires" (Additional nginx
#    directives).
# 4. Collez TOUT le contenu ci-dessous dans ce champ.
# 5. Cliquez sur "Appliquer" / "OK".
# 6. Testez immédiatement (pas besoin de redémarrer quoi que ce soit) :
#      curl -I https://ashtechpay.top/.env
#      curl -I https://ashtechpay.top/.git/HEAD
#      curl -I https://ashtechpay.top/wp-admin
#    → Ces trois commandes doivent maintenant répondre "403 Forbidden".
#
# IMPORTANT : gardez [F,L] (403) et non une redirection — ne changez pas cette
# logique, un bug connu de Safari iOS crée des téléchargements vides (0 KB)
# si on redirige un 404 vers la même URL.
# =============================================================================

# Autoriser le challenge ACME (renouvellement automatique des certificats SSL)
location ^~ /.well-known/acme-challenge/ {
    allow all;
}

# Autoriser explicitement les fichiers de convention publique (SEO / sécurité)
location = /robots.txt { allow all; }
location = /sitemap.xml { allow all; }
location = /humans.txt { allow all; }
location = /security.txt { allow all; }
location = /.well-known/security.txt { allow all; }
location = /crossdomain.xml { allow all; }
location = /clientaccesspolicy.xml { allow all; }

# Bloquer tous les fichiers/dossiers cachés (commençant par un point),
# sauf .well-known (déjà autorisé ci-dessus)
location ~ /\.(?!well-known) {
    deny all;
    return 403;
}

# Bloquer les panels d'admin, CMS, outils de base de données et exploits connus
location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|xmlrpc\.php|phpmyadmin|pma|adminer|dbadmin|admin\.php|administrator|administrator/index\.php|cpanel|whm|webmail|drupal|joomla|flask-admin|django-admin|rails/info)(/.*)?$ {
    deny all;
    return 403;
}

# Bloquer les web shells et fichiers d'exploitation connus
location ~* ^/(shell|cmd|c99|r57|eval|webshell)\.php$ {
    deny all;
    return 403;
}

# Bloquer les fichiers de configuration / secrets exposés
location ~* ^/(config|database|setup|install)\.php$ {
    deny all;
    return 403;
}
location ~* ^/(wp-config\.php(\.bak|~)?|\.aws(/.*)?|\.ssh(/.*)?|\.gitconfig|application\.(properties|yml)|sftp-config\.json)$ {
    deny all;
    return 403;
}

# Bloquer les sauvegardes et dumps de base de données
location ~* ^/(backup(s)?(/.*)?|wwwroot\.zip|site\.tar\.gz|(www|htdocs|site|website)\.zip|(db_backup|db|dump|database|backup)\.(sql|tar\.gz|zip))$ {
    deny all;
    return 403;
}

# Bloquer les endpoints d'infra/API qui n'existent pas dans cette app
location ~* ^/(rest/v1|realtime/v1|storage/v1|auth/v1|graphql|graphiql|__graphql|swagger(-ui(\.html)?)?|swagger\.(json|yaml)|openapi(\.(json|yaml))?|api-docs|redoc|actuator|solr/admin|manager/html|console|nginx_status|__status|_nodes|_cat/indices)(/.*)?$ {
    deny all;
    return 403;
}

# Bloquer les chemins de debug/logs/environnements de test
location ~* ^/(internal|private|debug|__debug|_debug|trace|debug\.log|logs(/.*)?|\.logs(/.*)?|var/log(/.*)?|(application|server|app|access|error)\.log|log|qa|testing|test|staging|development|dev|hidden|secret|archive(/.*)?|old(/.*)?)$ {
    deny all;
    return 403;
}

# Bloquer les artefacts de build / dépendances qui ne devraient jamais être servis
location ~* ^/(vendor(/.*)?|node_modules(/.*)?|\.cache(/.*)?|\.nuxt(/.*)?|\.next(/.*)?|\.idea(/.*)?|webpack-stats\.json|bundle\.js\.map)$ {
    deny all;
    return 403;
}

# Bloquer les fichiers de métadonnées de projet à la racine
location ~* ^/(package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|composer\.(json|lock)|gemfile(\.lock)?|requirements\.txt|pyproject\.toml|go\.(sum|mod)|pipfile(\.lock)?|tsconfig\.json|drizzle\.config\.ts|vite\.config\.ts|docker-compose\.ya?ml|dockerfile|makefile)$ {
    deny all;
    return 403;
}

# Bloquer les dossiers source serveur (ne devraient jamais être servis statiquement)
location ~* ^/(server|shared|migrations|script|attached_assets)/ {
    deny all;
    return 403;
}

# Bloquer par extension de fichier (source brut / sourcemaps)
location ~* \.(ts|tsx|map)$ {
    deny all;
    return 403;
}
