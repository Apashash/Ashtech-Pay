# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — Configuration Nginx pour ashtechpay.top
#
# COMMENT UTILISER SUR VOTRE SERVEUR (Plesk) :
#   1. Copiez ce fichier sur votre serveur
#   2. Dans Plesk → votre domaine → Apache & nginx Settings
#   3. Collez le contenu de la section "location" dans
#      "Additional nginx directives"
#   OU
#   Remplacez votre vhost Nginx par ce fichier complet.
# ─────────────────────────────────────────────────────────────────────────────

# ── SÉCURITÉ : ne transmettre Upgrade que pour WebSocket (anti H2C-smuggling)
# Sans ce map, un attaquant peut envoyer "Upgrade: h2c" et contourner le proxy.
map $http_upgrade $connection_upgrade {
    default   close;
    websocket upgrade;
}

server {
    listen 80;
    listen [::]:80;
    server_name ashtechpay.top www.ashtechpay.top;

    # Rediriger tout le HTTP vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ashtechpay.top www.ashtechpay.top;

    # ── SSL (Plesk gère ces chemins automatiquement) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ashtechpay.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ashtechpay.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Racine du site (frontend compilé uniquement) ──────────────────────────
    root /var/www/vhosts/ashtechpay.top/httpdocs/dist/public;
    index index.html;

    # ── Taille max upload (KYC documents) ────────────────────────────────────
    client_max_body_size 10M;

    # ── En-têtes de sécurité HTTP ─────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"         always;
    add_header X-Frame-Options           "DENY"            always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =========================================================================
    # SÉCURITÉ — Bloquer l'accès aux fichiers source AVANT Node.js
    # Ces règles s'appliquent IMMÉDIATEMENT, sans toucher Express.
    # =========================================================================

    # Bloquer les dossiers source serveur
    location ~ ^/(server|shared|node_modules|migrations|script|attached_assets)/ {
        return 404;
    }

    # Bloquer les fichiers de configuration et code source
    location ~* \.(ts|tsx|env|map|cjs\.map|config\.js|config\.ts)$ {
        return 404;
    }

    # Bloquer les fichiers sensibles à la racine
    location ~ ^/(package\.json|package-lock\.json|drizzle\.config\.ts|tsconfig\.json|\.env.*|\.git.*)$ {
        return 404;
    }

    # Bloquer les fichiers cachés (commençant par un point)
    location ~ /\. {
        return 404;
    }

    # =========================================================================
    # PROXY — Toutes les requêtes /api/* vers Node.js (Express)
    # =========================================================================
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        # Utilise $connection_upgrade (défini dans le map ci-dessus) pour n'autoriser
        # que les upgrades WebSocket légitimes — empêche le H2C smuggling.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # WebSocket pour Vite HMR (dev) et notifications temps réel
    location /vite-hmr {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # Pages de paiement et checkout hébergé → Node.js
    location ~ ^/(pay|hpay)/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # FRONTEND — Servir les assets statiques compilés (dist/public)
    # =========================================================================

    # Assets avec hash dans le nom → cache longue durée
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — toutes les autres routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/ashtechpay.top-access.log;
    error_log  /var/log/nginx/ashtechpay.top-error.log;
}
